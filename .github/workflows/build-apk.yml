name: Build Megingiard-ZH APK

on:
  push:
    branches:
      - main-zh
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    name: Build Megingiard-ZH APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :companion:ui:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        run: |
          mkdir -p output
          cp companion/ui/build/outputs/apk/debug/ui-debug.apk output/megingiard-v0.9.0-zh.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: megingiard-v0.9.0-zh-apk
          path: output/megingiard-v0.9.0-zh.apk
          retention-days: 30
